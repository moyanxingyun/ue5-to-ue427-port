name: Feature request
description: Propose a new workflow or compatibility improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What Unreal Engine migration task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome, config inputs and report output.
    validations:
      required: true
  - type: input
    id: engines
    attributes:
      label: Relevant engine versions
      placeholder: "UE 5.4 → UE 4.27.2"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: The proposal can provide a dry-run, report or restore path for mutating work.
          required: true
