<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PortKit UE5 to UE 4.27 migration pipeline</title>
  <desc id="desc">UE5 exports FBX, images, JSON and material dumps, which PortKit rebuilds in UE 4.27.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b2f"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42f5d3"/>
      <stop offset="1" stop-color="#5ba8ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8bb8d8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <circle cx="1020" cy="60" r="170" fill="#38d9c0" opacity=".07"/>
  <circle cx="1110" cy="380" r="180" fill="#4b8dff" opacity=".08"/>

  <g transform="translate(66 58)">
    <rect width="505" height="34" rx="17" fill="#42f5d3" opacity=".12"/>
    <circle cx="18" cy="17" r="5" fill="#42f5d3"/>
    <text x="34" y="22" fill="#a8ffe9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" letter-spacing="1.6">EDITOR PYTHON MIGRATION TOOLKIT</text>
    <text x="0" y="112" fill="#f6fbff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="72" font-weight="760" letter-spacing="-2">PortKit</text>
    <text x="2" y="164" fill="#61a8ff" font-family="Segoe UI, Consolas, sans-serif" font-size="33" font-weight="650">UE5  →  UE 4.27</text>
    <text x="2" y="208" fill="#b9c8d8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">Export. Rebuild. Verify.</text>
    <text x="2" y="244" fill="#7f95aa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Meshes · Materials · Decals · Foliage · Placement</text>
    <g transform="translate(2 282)">
      <rect width="112" height="34" rx="8" fill="#16283c" stroke="#28425c"/>
      <text x="16" y="22" fill="#b9d6ea" font-family="Segoe UI, sans-serif" font-size="13">OPEN SOURCE</text>
      <rect x="122" width="68" height="34" rx="8" fill="#16283c" stroke="#28425c"/>
      <text x="143" y="22" fill="#b9d6ea" font-family="Segoe UI, sans-serif" font-size="13">MIT</text>
    </g>
  </g>

  <g transform="translate(647 72)">
    <rect width="480" height="276" rx="20" fill="#0a1626" fill-opacity=".9" stroke="#25415b"/>
    <text x="30" y="43" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="1.3">DISK-BASED BRIDGE</text>

    <g transform="translate(30 72)">
      <rect width="122" height="154" rx="14" fill="#10243a" stroke="#2b5a7b"/>
      <text x="20" y="35" fill="#67d8ff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">UE5</text>
      <text x="20" y="65" fill="#f0f7ff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Source</text>
      <text x="20" y="91" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="13">Inspect</text>
      <text x="20" y="113" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="13">Export</text>
      <text x="20" y="135" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="13">Report</text>
    </g>

    <path d="M163 149 H188" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M181 141 L191 149 L181 157" fill="none" stroke="#5ba8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(200 72)">
      <rect width="130" height="154" rx="14" fill="#102a32" stroke="#2f8e87"/>
      <text x="18" y="35" fill="#7fffe4" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">BRIDGE</text>
      <text x="18" y="68" fill="#f0f7ff" font-family="Consolas, monospace" font-size="16" font-weight="700">FBX</text>
      <text x="18" y="94" fill="#f0f7ff" font-family="Consolas, monospace" font-size="16" font-weight="700">PNG / TGA</text>
      <text x="18" y="120" fill="#f0f7ff" font-family="Consolas, monospace" font-size="16" font-weight="700">JSON</text>
      <text x="18" y="146" fill="#f0f7ff" font-family="Consolas, monospace" font-size="16" font-weight="700">T3D</text>
    </g>

    <path d="M341 149 H366" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M359 141 L369 149 L359 157" fill="none" stroke="#5ba8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(378 72)">
      <rect width="72" height="154" rx="14" fill="#14223c" stroke="#3c5f94"/>
      <text x="14" y="35" fill="#95baff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">4.27</text>
      <text x="14" y="68" fill="#f0f7ff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">Build</text>
      <text x="14" y="98" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="12">Import</text>
      <text x="14" y="120" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="12">Verify</text>
      <text x="14" y="142" fill="#7f95aa" font-family="Segoe UI, sans-serif" font-size="12">Place</text>
    </g>

    <rect x="30" y="244" width="420" height="1" fill="#223a50"/>
    <text x="30" y="266" fill="#91a8bd" font-family="Segoe UI, sans-serif" font-size="13">A resumable, report-driven migration path</text>
  </g>
</svg>
